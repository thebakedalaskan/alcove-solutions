<!-- title: A journey, step by step -->
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="st" data-theme="{{theme}}" style="width: {{width}}px">
<div class="st-head"><span class="ac-eyebrow">{{j.eyebrow}}</span><h1>{{j.title}}</h1><p>{{j.blurb}}</p></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div class="st-s {{phCls}}">
<p class="st-did"><i>{{s.n}}</i><span>{{s.did}}</span></p>
<div class="st-th {{phCls}}"><div class="st-z {{phCls}}"><dc-import name="Scene" node="{{s.node}}" hot="{{s.hot}}" phone="{{phone}}" dark="{{dark}}" hint-size="1280px,800px"></dc-import></div></div>
<p class="st-see">{{s.see}}</p>
<p class="st-mv"><ic n="waveform" s="14"></ic><span>{{s.mv}}</span></p>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"persona":{"editor":"enum","options":["call","rooms","phone"],"default":"call"},"journey":{"editor":"text","default":"start"},"only":{"editor":"text","default":""},"dark":{"editor":"boolean","default":false},"$preview":{"width":4096,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    var persona = this.props.persona || 'call';
    var js = window.J[persona];
    var id = this.props.journey || 'start';
    var j = js.filter(function (x) { return x.id === id; })[0] || js[0];
    var only = String(this.props.only || '').split(',').filter(Boolean).map(Number);
    var steps = j.steps.map(function (s, i) { return Object.assign({}, s, { n: i + 1 }); });
    if (only.length) steps = steps.filter(function (s, i) { return only.indexOf(i) >= 0; });
    steps = steps.map(function (s, i) { return Object.assign({}, s, { hot: s.hot || '', n: i + 1 }); });
    var phone = persona === 'phone';
    var dark = this.props.dark === true || this.props.dark === 'true';
    return { dark: dark, j: j, steps: steps, phone: phone, phCls: phone ? 'is-ph' : '', theme: dark ? 'dark' : 'light', width: 96 + 300 + steps.length * (phone ? 315 : 628) - 68 };
  }
}
</script>
