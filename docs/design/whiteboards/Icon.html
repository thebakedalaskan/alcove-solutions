<style>body{margin:0}</style>

<sc-if value="{{one}}" hint-placeholder-val="{{true}}">
<svg class="ac-i" width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="{{fill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d}}"></path></svg>
</sc-if>
<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
<div data-theme="light" style="min-height: 100vh; box-sizing: border-box; padding: 36px; background: var(--ground); color: var(--ink); font-family: var(--font-sans)">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px">
<sc-for list="{{all}}" as="ic" hint-placeholder-count="12">
<div style="display: grid; justify-items: center; gap: 9px; padding: 16px 6px 12px; border-radius: 13px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink-2)">
<svg width="22" height="22" viewBox="0 0 24 24" fill="{{ic.fill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ic.d}}"></path></svg>
<span style="font: 500 11px/1 var(--font-mono); color: var(--ink-3)">{{ic.k}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>
