<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="screens.css">
<link rel="stylesheet" href="app.css">
<script>
  (function () {
    var d = matchMedia('(prefers-color-scheme: dark)').matches;
    try { var s = localStorage.getItem('alcove-theme'); if (s) d = s === 'dark'; } catch (e) {}
    var q = /[?&]theme=(light|dark)/.exec(location.search); if (q) d = q[1] === 'dark';
    if (d) document.documentElement.classList.add('dark');
  })();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="al-spill" cx="50%" cy="66%" r="62%">
      <stop offset="0" stop-color="#FFB24A" stop-opacity=".62"/>
      <stop offset=".55" stop-color="#FFA62B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFA62B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="al-flame" cx="40%" cy="36%" r="70%">
      <stop offset="0" stop-color="#FFE3AE"/>
      <stop offset=".55" stop-color="#FFAE3D"/>
      <stop offset="1" stop-color="#F08A12"/>
    </radialGradient>
  </defs>
</svg>
<div id="app"></div>
<div id="layer"></div>
<div id="mapc"></div>
<pre id="al-err" hidden></pre>
<script>
  window.addEventListener('error', function (e) { var p = document.getElementById('al-err'); p.hidden = false; p.textContent += (e.message || e) + '\n'; });
</script>
<script src="app.js"></script>
</body>
</html>
