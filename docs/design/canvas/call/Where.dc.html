<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where everything went</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="call.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="cv wh light">
<div class="wh-head"><h1>Where everything went</h1><p>Every control in today’s call, and where it is now. Nothing is dropped; a few things merge.</p></div>
<div class="wh-cols"><span>What you want to do</span><span>Today</span><span>Now</span></div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<h2 class="wh-g">{{g.name}}</h2>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="6">
<div class="wh-r"><span class="w">{{r.w}}</span><span class="t">{{r.t}}</span><span class="n">{{r.n}}</span></div>
</sc-for>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1520,"height":2450}}'>

</script>
</body>
</html>
