<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play the call</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="call.css">
<script src="icons.js"></script>
<script src="nc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="cv pl light">
<div class="pl-top">
<div class="pl-t"><h1>Play the call</h1><p>Pick a journey, then press what’s ringed. Everything else you press works too; the arrows bring the journey back.</p></div>
<div class="pl-ctl">
<button type="button" class="pl-b" onClick="{{toggle}}"><svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="{{playIcon}}"></path></svg>{{playLabel}}</button>
<button type="button" class="pl-ib" aria-label="Step back" onClick="{{back}}"><svg class="i" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="{{I.left}}"></path></svg></button>
<button type="button" class="pl-ib" aria-label="Next step" onClick="{{next}}"><svg class="i" width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path d="{{I.right}}"></path></svg></button>
</div>
</div>
<div class="pl-js" role="group" aria-label="Journeys">
<sc-for list="{{journeys}}" as="x" hint-placeholder-count="8"><button type="button" class="pl-j" aria-pressed="{{x.on}}" onClick="{{x.pick}}"><i>{{x.n}}</i>{{x.title}}</button></sc-for>
</div>
<div class="pl-frame {{phCls}}">
<sc-if value="{{wide}}" hint-placeholder-val="{{true}}"><dc-import name="Call" m="{{m}}" on-press="{{press}}" hint-size="1440px,900px"></dc-import></sc-if>
<sc-if value="{{phone}}" hint-placeholder-val="{{false}}"><div class="pl-phone"><dc-import name="Call" m="{{m}}" on-press="{{press}}" hint-size="390px,844px"></dc-import></div></sc-if>
</div>
<div class="pl-cap">
<div class="pl-n">{{n}}<small>of {{total}}</small></div>
<div class="pl-c"><span>How you get here</span><p>{{did}}</p></div>
<div class="pl-c"><span>What happens</span><p>{{see}}</p></div>
<sc-if value="{{free}}" hint-placeholder-val="{{false}}"><div class="pl-free"><svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="{{I.cursor}}"></path></svg>Exploring on your own. The arrows bring the journey back.</div></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1520,"height":1250}}'>
/* The call, playable: each journey a step at a time, with whatever you press doing what it would. */
class Component extends DCLogic {
  js() { return window.NC.JOURNEYS; }
  frame() { var s = this.state || {}, j = this.js()[s.j || 0]; return { j: j, f: j.frames[s.i || 0], i: s.i || 0 }; }
  moment() { var s = this.state || {}, c = this.frame(); return s.free || window.NC.step(c.f.step, c.f.hot); }
  go(i) {
    var c = this.frame();
    if (i < 0 || i >= c.j.frames.length) { this.setState({ playing: false }); return; }
    this.setState({ i: i, free: null });
  }
  componentDidMount() {
    var m = /j=(\d+)(?:&s=(\d+))?/.exec(location.hash);
    if (m) this.setState({ j: +m[1], i: +(m[2] || 0) });
  }
  componentDidUpdate(_, prev) {
    var s = this.state || {}, was = prev || {}, self = this;
    if (s.playing !== was.playing || s.i !== was.i || s.j !== was.j) {
      clearTimeout(this.t);
      if (s.playing) this.t = setTimeout(function () { self.go((self.state.i || 0) + 1); }, 2600);
    }
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    var self = this, NC = window.NC, s = this.state || {}, c = this.frame(), m = this.moment();
    return {
      I: NC.I, m: m, wide: !m.phone, phone: !!m.phone, phCls: m.phone ? 'is-ph' : '',
      journeys: this.js().map(function (x, k) {
        return { n: String(x.n), title: x.title, on: k === (s.j || 0) ? 'true' : 'false', pick: function () { self.setState({ j: k, i: 0, free: null, playing: false }); } };
      }),
      n: String(c.i + 1), total: String(c.j.frames.length), did: c.f.did, see: c.f.see, free: !!s.free,
      press: function (id) {
        if (id === 'noop') return;
        var cc = self.frame();
        if (!(self.state || {}).free && cc.f.hot && id === cc.f.hot) { self.setState({ playing: false }); self.go(cc.i + 1); return; }
        self.setState({ free: NC.act(self.moment(), id), playing: false });
      },
      playIcon: NC.I[s.playing ? 'pause' : 'circlePlay'], playLabel: s.playing ? 'Pause' : 'Watch it',
      toggle: function () { self.setState({ playing: !s.playing, free: null }); },
      back: function () { self.setState({ playing: false }); self.go(self.frame().i - 1); },
      next: function () { self.setState({ playing: false }); self.go(self.frame().i + 1); }
    };
  }
}
</script>
</body>
</html>
