<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wide, small and a phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="call.css">
<script src="icons.js"></script>
<script src="nc.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="cv sz light">
<div class="st-head"><div><h1>One moment, at every size</h1><p>A board you’re presenting, with Chat open on your side. The places don’t move; what gives way is how the people sit. Your side follows your theme; the stage stays night.</p></div></div>
<div class="sz-grid">
<figure class="sz-f"><div class="sz-th" style="width: 768px; height: 432px"><div class="sz-z" style="width: 1920px; height: 1080px; transform: scale(.4)"><dc-import name="Call" m="{{wide}}" hint-size="1920px,1080px"></dc-import></div></div><figcaption><b>1920 wide.</b> The people stand as tiles beside the board, and your side has room to spare.</figcaption></figure>
<figure class="sz-f"><div class="sz-th" style="width: 614px; height: 461px"><div class="sz-z" style="width: 1024px; height: 768px; transform: scale(.6)"><dc-import name="Call" m="{{small}}" hint-size="1024px,768px"></dc-import></div></div><figcaption><b>1024 wide.</b> The people drop to a row of arches over the board, and it zooms out to fit.</figcaption></figure>
<figure class="sz-f"><div class="sz-th" style="width: 768px; height: 480px"><div class="sz-z" style="width: 1440px; height: 900px; transform: scale(.5334)"><dc-import name="Call" m="{{light}}" hint-size="1440px,900px"></dc-import></div></div><figcaption><b>The light theme.</b> Notes on your side is light; the stage, the dock and what’s shared stay night.</figcaption></figure>
<figure class="sz-f"><div class="sz-th is-ph" style="width: 222px; height: 480px"><div class="sz-z" style="width: 390px; height: 844px; transform: scale(.5687)"><dc-import name="Call" m="{{phone}}" hint-size="390px,844px"></dc-import></div></div><figcaption><b>A phone.</b> What’s shared fills the screen under the faces; your side opens as a sheet.</figcaption></figure>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1554,"height":1350}}'>
/* The same moment at three sizes. */
class Component extends DCLogic {
  renderVals() {
    var NC = window.NC;
    return {
      wide: Object.assign(NC.step('boardChat'), { W: 1920, H: 1080 }),
      small: Object.assign(NC.step('boardChat'), { W: 1024, H: 768 }),
      light: NC.step('notesLight'),
      phone: NC.step('pBoardQuiet')
    };
  }
}
</script>
</body>
</html>
