<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agents, step by step</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="page-settings.css">
<link rel="stylesheet" href="page-agents.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
<script src="appdata.js"></script>
<script src="data-settings.js"></script>
<script src="data-agents.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fl" style="width: 5432px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section class="fl-r">
<h2 class="fl-h">{{r.name}}</h2>
<div class="fl-s">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="3">
<div class="fl-f{{r.cls}}">
<p class="fl-c"><span>{{f.n}}</span>{{f.t}}</p>
<div class="fl-box"><div class="fl-in">
<sc-if value="{{f.agents}}" hint-placeholder-val="{{true}}"><dc-import name="Agents" mode="{{r.mode}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></sc-if>
<sc-if value="{{f.settings}}" hint-placeholder-val="{{false}}"><dc-import name="Settings" mode="{{r.mode}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></sc-if>
</div></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":5432,"height":7583}}'>
class Component extends DCLogic {
  renderVals() {
    var G = window.AH.AG;
    var rows = G.JOURNEYS.concat([{ name: 'On a phone, by day', phone: true, light: true, frames: G.JOURNEYS_PHONE }]);
    return {
      rows: rows.map(function (r) {
        return {
          name: r.name, cls: r.phone ? ' is-phone' : '', mode: r.light ? 'light' : 'dark',
          frames: r.frames.map(function (f, i) { return { n: i + 1, t: f.t, step: f.step, agents: f.board === 'Agents', settings: f.board === 'Settings' }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
