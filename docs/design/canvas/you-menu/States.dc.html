<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your menu, every state</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="water.css">
<link rel="stylesheet" href="page-settings.css">
<link rel="stylesheet" href="account.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
<script src="appdata.js"></script>
<script src="water.js"></script>
<script src="account.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fl" style="width: 4668px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section class="fl-r">
<h2 class="fl-h">{{r.name}}</h2>
<div class="fl-s">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="3">
<div class="fl-f{{f.cls}}">
<p class="fl-c"><span>{{f.n}}</span>{{f.t}}</p>
<div class="fl-box"><div class="fl-in"><dc-import name="Main" mode="{{f.mode}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></div></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4668,"height":3260}}'>
class Component extends DCLogic {
  renderVals() {
    var AM = window.AH.AM;
    var rows = AM.STATES.concat([
      { name: 'On a phone', frames: [
        { step: 'amRest', phone: true, t: 'Your face, in the top bar.' },
        { step: 'amOpen', phone: true, t: 'The menu, as a sheet.' },
        { step: 'amPaused', phone: true, t: 'Paused.' },
        { step: 'amOpen', phone: true, mode: 'light', t: 'In the light.' },
        { step: 'amAskBoth', phone: true, t: 'Sign out asks.' }
      ] }
    ]);
    return {
      rows: rows.map(function (r) {
        return {
          name: r.name,
          frames: r.frames.map(function (f, i) {
            return { n: i + 1, t: f.t, step: f.step, mode: f.mode || 'dark', cls: f.phone ? ' is-phone' : '' };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
