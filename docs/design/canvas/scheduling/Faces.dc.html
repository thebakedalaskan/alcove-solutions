<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>People in the arch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
</head>

<path d="{{p.bunShade}}" fill="{{p.hairDark}}" opacity=".6"></path><path d="{{p.glasses}}" fill="#fff" fill-opacity=".12" stroke="#2A201B" stroke-width="2.2"></path><path d="{{p.bridge}}" stroke="#2A201B" stroke-width="2.2" fill="none"></path><path d="{{p.earrings}}" fill="#FFC35E"></path></svg>
</sc-if>
<sc-if value="{{p.initial}}" hint-placeholder-val="{{false}}"><span class="initial">{{p.letter}}</span></sc-if>
</span>
</sc-for>
<sc-if value="{{hasMore}}" hint-placeholder-val="{{false}}"><span class="more">+{{more}}</span></sc-if>
</span>
</sc-if>
<sc-if value="{{sheet}}" hint-placeholder-val="{{false}}">
<div style="min-height: 100vh; box-sizing: border-box; padding: 36px; background: oklch(.955 .007 80); color: oklch(.25 .05 268); font-family: &quot;Hanken Grotesk&quot;, system-ui, sans-serif">
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 22px 12px">
<sc-for list="{{people}}" as="p" hint-placeholder-count="8">
<div style="display: grid; justify-items: center; gap: 10px; text-align: center">
<span class="ac-avatar" title="{{p.name}}" style="--size: {{p.size}}px; background: {{p.bg}}">
<sc-if value="{{p.art}}" hint-placeholder-val="{{true}}">
<svg viewBox="20 26 160 166" aria-hidden="true"><path d="{{p.back}}" fill="{{p.hair}}"></path><path d="M26 240C28 180 61 152 100 152C139 152 172 180 174 240Z" fill="{{p.shirt}}"></path><path d="M26 240C28 180 61 152 100 152C76 160 56 186 52 240Z" fill="{{p.shirtDark}}" opacity=".35"></path><path d="M88 122V148C92 153 108 153 112 148V122Z" fill="{{p.skin}}"></path><path d="M88 130C95 138 105 138 112 130V124C105 132 95 132 88 124Z" fill="{{p.skinDark}}" opacity=".45"></path><path d="M85 151C90 160 110 160 115 151C110 154 90 154 85 151Z" fill="{{p.shirtDark}}" opacity=".5"></path><ellipse cx="67" cy="101" rx="5.5" ry="8" fill="{{p.skinDark}}"></ellipse><ellipse cx="133" cy="101" rx="5.5" ry="8" fill="{{p.skinDark}}"></ellipse><ellipse cx="100" cy="97" rx="33" ry="38.5" fill="{{p.skin}}"></ellipse><path d="M100 58.5C118 58.5 133 75 133 97C133 120 118 135.5 100 135.5C112 128 120 112 120 97C120 80 112 66 100 58.5Z" fill="{{p.skinDark}}" opacity=".18"></path><path d="{{p.beard1}}" fill="{{p.hair}}" opacity=".92"></path><path d="{{p.beard2}}" fill="{{p.hair}}"></path><circle cx="83" cy="113" r="6.5" fill="#F07C7C" opacity=".16"></circle><circle cx="117" cy="113" r="6.5" fill="#F07C7C" opacity=".16"></circle><ellipse cx="88" cy="100" rx="3.1" ry="3.8" fill="#2A201B"></ellipse><ellipse cx="112" cy="100" rx="3.1" ry="3.8" fill="#2A201B"></ellipse><circle cx="89.1" cy="98.8" r=".9" fill="#fff" opacity=".7"></circle><circle cx="113.1" cy="98.8" r=".9" fill="#fff" opacity=".7"></circle><path d="M80 89.5Q88 85 95.5 88.5M104.5 88.5Q112 85 120 89.5" stroke="{{p.hairDark}}" stroke-width="2.6" stroke-linecap="round" fill="none" opacity=".9"></path><path d="M100 103Q96.5 112 101 114.5" stroke="{{p.skinDark}}" stroke-width="2" stroke-linecap="round" fill="none" opacity=".75"></path><path d="M91 121.5Q100 128 109 121.5" stroke="#7A3A2E" stroke-width="2.5" stroke-linecap="round" fill="none"></path><path d="{{p.front}}" fill="{{p.hair}}"></path><path d="{{p.bun}}" fill="{{p.hair}}"></path> </sc-if>
<sc-if value="{{p.initial}}" hint-placeholder-val="{{false}}"><span class="initial">{{p.letter}}</span></sc-if>
</span>
<span style="font: 600 12.5px/1.25 &quot;Hanken Grotesk&quot;, system-ui, sans-serif; color: oklch(.42 .04 268)">{{p.name}}</span>
</div>
</sc-for>
</div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"text","default":""},"size":{"editor":"int","default":28,"min":16,"max":96},"max":{"editor":"int","default":4,"min":1,"max":12},"ring":{"editor":null,"default":""},"$preview":{"width":1000,"height":820}}'>

var NONE = 'M0 0';
function circ(c) { var x = c[0], y = c[1], r = c[2]; return 'M' + (x - r) + ' ' + y + 'a' + r + ' ' + r + ' 0 1 0 ' + 2 * r + ' 0a' + r + ' ' + r + ' 0 1 0 ' + -2 * r + ' 0'; }
function rr(x, y, w, h, r) { return 'M' + (x + r) + ' ' + y + 'h' + (w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + r + 'v' + (h - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + r + 'h' + -(w - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + -r + ' ' + -r + 'v' + -(h - 2 * r) + 'a' + r + ' ' + r + ' 0 0 1 ' + r + ' ' + -r + 'z'; }

class Component extends DCLogic {

    var size = Number(this.props.size) || (sheet ? 64 : 28);
    var max = Number(this.props.max) || 4;
    var ids = sheet ? Object.keys(P) : who;
    var shown = sheet ? ids : ids.slice(0, max);
    var ring = this.props.ring || (shown.length > 1 ? 'var(--surface)' : 'transparent');
    var overlap = Math.max(5, Math.round(size * 0.2));
    return {
      group: !sheet,
      sheet: sheet,
      people: shown.map(function (id, i) { return person(id, sheet ? 64 : size, sheet || i === 0 ? 0 : -overlap, ring); }),
      more: ids.length - shown.length,

  }

</script>
</body>
</html>
