<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Record, step by step</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="page-record.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
<script src="appdata.js"></script>
<script src="data-record.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fl" style="width: 4668px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section class="fl-r">
<h2 class="fl-h">{{r.name}}</h2>
<div class="fl-s">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="3">
<div class="fl-f{{r.cls}}">
<p class="fl-c"><span>{{f.n}}</span>{{f.t}}</p>
<div class="fl-box"><div class="fl-in"><dc-import name="Record" frame="1" mode="dark" scene="{{f.scene}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></div></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4668,"height":11261}}'>
class Component extends DCLogic {
  renderVals() {
    var rows = window.AH.RC.JOURNEYS.concat([{ name: 'On a phone', phone: true, frames: [
      { step: 'record', t: 'Record.' },
      { step: 'checking', t: 'Check the level.' },
      { step: 'micOpen', t: 'Choose a microphone.' },
      { step: 'live', t: 'Recording.' },
      { step: 'paused', t: 'Paused.' },
      { step: 'liveOffline', t: 'Offline, still recording.' },
      { step: 'leave', t: 'Leave, or discard.' },
      { step: 'writing', t: 'The note, being written.' },
      { step: 'first', t: 'First day.' }
    ] }]);
    return {
      rows: rows.map(function (r) {
        return {
          name: r.name, cls: r.phone ? ' is-phone' : '',
          frames: r.frames.map(function (f, i) { return { n: i + 1, t: f.t, step: f.step, scene: f.scene || 'today' }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
