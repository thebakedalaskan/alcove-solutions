<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings, step by step</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="page-settings.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
<script src="appdata.js"></script>
<script src="data-settings.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fl" style="width: 3904px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section class="fl-r">
<h2 class="fl-h">{{r.name}}</h2>
<div class="fl-s">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="3">
<div class="fl-f{{r.cls}}">
<p class="fl-c"><span>{{f.n}}</span>{{f.t}}</p>
<div class="fl-box"><div class="fl-in">
<sc-if value="{{f.home}}" hint-placeholder-val="{{false}}"><dc-import name="Home" pal="blue-hour" mode="{{f.mode}}" take="page" scene="today" step="home" hint-size="1440px,900px"></dc-import></sc-if>
<sc-if value="{{f.page}}" hint-placeholder-val="{{true}}"><dc-import name="Settings" mode="{{f.mode}}" scene="{{f.scene}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></sc-if>
</div></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3904,"height":14952}}'>
class Component extends DCLogic {
  renderVals() {
    var T = window.AH.ST2;
    var rows = T.JOURNEYS.concat([{ name: 'In the light', frames: T.LIGHT }, { name: 'On a phone', phone: true, frames: T.PHONE }]);
    return {
      rows: rows.map(function (r) {
        return {
          name: r.name, cls: r.phone ? ' is-phone' : '',
          frames: r.frames.map(function (f, i) { return { n: i + 1, t: f.t, step: f.step || 'rest', scene: f.scene || 'today', mode: f.mode || 'dark', home: !!f.home, page: !f.home }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
