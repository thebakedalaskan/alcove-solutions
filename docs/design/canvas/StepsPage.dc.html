<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, step by step</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&amp;family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="fl" style="width: 4668px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
<section class="fl-r">
<h2 class="fl-h">{{r.name}}</h2>
<div class="fl-s">
<sc-for list="{{r.frames}}" as="f" hint-placeholder-count="3">
<div class="fl-f{{r.cls}}">
<p class="fl-c"><span>{{f.n}}</span>{{f.t}}</p>
<div class="fl-box"><div class="fl-in"><dc-import name="Home" pal="blue-hour" mode="dark" take="page" scene="{{f.scene}}" step="{{f.step}}" hint-size="1440px,900px"></dc-import></div></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4668,"height":5722}}'>
class Component extends DCLogic {
  renderVals() {
    var key = 'page';
    var rows = window.AH.JOURNEYS_HOME.filter(function (r) { return !r.only || r.only.indexOf(key) >= 0; }).concat([{ name: 'On a phone', phone: true, frames: [
      { step: 'home', t: 'Today.' },
      { scene: 'soon', step: 'home', t: 'A call is about to start.' },
      { step: 'who', t: 'Schedule.' },
      { step: 'answer', t: 'Ask your notes.' },
      { scene: 'first', step: 'home', t: 'First day.' }
    ] }]);
    return {
      rows: rows.map(function (r) {
        return {
          name: r.name, cls: r.phone ? ' is-phone' : '',
          frames: r.frames.map(function (f, i) { return { n: i + 1, t: f[key] || f.t, step: f.step, scene: f.scene || 'today' }; })
        };
      })
    };
  }
}
</script>
</body>
</html>
