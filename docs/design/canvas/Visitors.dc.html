<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What passes through</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="pages.css">
<script src="tokens.js"></script>
<script src="home.js"></script>
<script src="scene.js"></script>
<script src="appdata.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div class="lf" data-moment="{{moment}}" data-night="{{night}}" style="{{vars}}" aria-hidden="true">
<div class="lf-up"><sc-for list="{{puffs}}" as="c" hint-placeholder-count="2"><div class="hz-puff" style="{{c.style}}"><div style="{{c.at}}"><sc-for list="{{c.bars}}" as="b" hint-placeholder-count="4"><i style="{{b.style}}"></i></sc-for></div></div></sc-for></div>
<sc-if value="{{isShip}}" hint-placeholder-val="{{false}}">
<div class="{{shipCls}}" style="{{shipStyle}}" onAnimationEnd="{{slowEnd}}">
<div class="hz-craft" style="{{craftStyle}}">
<sc-if value="{{hasFunnel}}" hint-placeholder-val="{{false}}"><div class="hz-funnel" style="{{funnelStyle}}"><i class="hz-smoke"></i><i class="hz-smoke is-2"></i><i class="hz-smoke is-3"></i></div></sc-if>
<svg class="hz-boat" viewBox="{{shipBox}}"><sc-for list="{{shipPaths}}" as="p" hint-placeholder-count="3"><path d="{{p.d}}"></path></sc-for></svg>
<i class="hz-lamp" style="{{lampStyle}}"></i>
</div>
<i class="hz-wake"></i><i class="hz-wake is-2"></i><i class="hz-wake is-3"></i>
</div>
</sc-if>
<sc-if value="{{isBalloon}}" hint-placeholder-val="{{false}}">
<div class="hz-peek" style="{{slowDur}}" onAnimationEnd="{{slowEnd}}"><div class="hz-climb" style="{{slowDur}}"><svg class="hz-balloon" viewBox="0 0 30 44"><path d="M15 1C7 1 1 7 1 15C1 22.5 8 27 11 33H19C22 27 29 22.5 29 15C29 7 23 1 15 1Z"></path><path class="hz-gore" d="M15 1C11.5 1 9 7 9 15C9 22 11.5 28 13 33H17C18.5 28 21 22 21 15C21 7 18.5 1 15 1Z"></path><path d="M12.5 37H17.5V42H12.5Z"></path><path class="hz-rope" d="M11.5 33L13 37M18.5 33L17 37"></path></svg></div></div>
</sc-if>
<sc-if value="{{isGulls}}" hint-placeholder-val="{{false}}">
<div class="{{flyCls}}" style="{{flyStyle}}" onAnimationEnd="{{quickEnd}}"><div class="hz-glide">
<sc-for list="{{birds}}" as="b" hint-placeholder-count="3"><div class="hz-gull" style="{{b.style}}"><svg class="is-0" viewBox="0 0 28 14"><path d="{{pose0}}"></path></svg><svg class="is-1" viewBox="0 0 28 14"><path d="{{pose1}}"></path></svg><svg class="is-2" viewBox="0 0 28 14"><path d="{{pose2}}"></path></svg></div></sc-for>
</div></div>
</sc-if>
<sc-if value="{{isLeap}}" hint-placeholder-val="{{false}}">
<div class="{{leapCls}}" style="{{leapStyle}}">
<sc-for list="{{jumps}}" as="j" hint-placeholder-count="1"><div class="{{j.cls}}" style="{{j.style}}"><i class="hz-ring"></i><div class="hz-along"><div class="hz-arc"><svg class="hz-leaper" viewBox="{{j.box}}"><path d="{{j.d}}"></path></svg></div></div><i class="hz-ring is-late" onAnimationEnd="{{j.end}}"></i></div></sc-for>
</div>
</sc-if>
<sc-if value="{{isWhale}}" hint-placeholder-val="{{false}}">
<div class="hz-whale" style="{{leapStyle}}"><div class="hz-sound"><svg class="hz-tail" viewBox="0 0 44 28" onAnimationEnd="{{quickDone}}"><path d="M22 28C20.5 20 19.5 15 19 12C17 12.5 12.5 11.5 8 8C5 5.5 2.5 3 1 1C6 1.5 13 2 17.5 4C20 5 21.5 6.3 22 7.3C22.5 6.3 24 5 26.5 4C31 2 38 1.5 43 1C41.5 3 39 5.5 36 8C31.5 11.5 27 12.5 25 12C24.5 15 23.5 20 22 28Z"></path></svg></div><i class="hz-ring"></i><i class="hz-ring is-late"></i></div>
</sc-if>
<sc-if value="{{isStar}}" hint-placeholder-val="{{false}}">
<i class="{{shootCls}}" style="{{leapStyle}}" onAnimationEnd="{{quickEnd}}"></i>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":null,"default":"home"},"mode":{"editor":null,"default":"dark"},"only":{"editor":null,"default":null},"pace":{"editor":null,"default":null},"$preview":{"width":1200,"height":420}}'>

  dolphin: { box: '0 0 34 16', d: 'M1 11C6 5 13 2 19 2L23 0L23.5 3C27 4 30 6 33 10L29.5 9C26 9 25 9 22 9.5C17 10 12 12 8 14.5L6 12.5C4 12.5 2.5 12 1 11Z' }

var LEAPS = {
  fish: [{ shape: 'fish', late: '0s', x: 0, y: 0 }],
  flyer: [{ shape: 'flyer', late: '0s', x: 0, y: 0 }],
  marlin: [{ shape: 'marlin', late: '0s', x: 0, y: 0 }],
  dolphins: [{ shape: 'dolphin', late: '0s', x: 0, y: 0 }, { shape: 'dolphin', late: '.55s', x: -30, y: 3 }],
  school: [

    { shape: 'minnow', late: '.4s', x: 24, y: -1 }, { shape: 'minnow', late: '.56s', x: 6, y: 7 }
  ]
};
var POSES = [
  'M3 .5C5 3 7.5 5.5 10 6.6C11.6 7.3 13 7.9 14 8.6C15 7.9 16.4 7.3 18 6.6C20.5 5.5 23 3 25 .5C24.6 3.6 22.6 6.6 19.6 8.2C17.4 9.4 15.4 10 14 11C12.6 10 10.6 9.4 8.4 8.2C5.4 6.6 3.4 3.6 3 .5Z',
  'M0 6.5C3 4.5 7 3 10 4.5C11.6 5.3 13 7 14 8.2C15 7 16.4 5.3 18 4.5C21 3 25 4.5 28 6.5C24.5 5.6 21 5.4 18.5 6.6C16.6 7.6 15.2 9.2 14 10.4C12.8 9.2 11.4 7.6 9.5 6.6C7 5.4 3.5 5.6 0 6.5Z',

var FLOCK = [{ x: 0, y: 0, w: 28, after: '0s' }, { x: -30, y: -11, w: 23, after: '-1.7s' }, { x: -34, y: 12, w: 22, after: '-3.1s' }, { x: -58, y: -20, w: 19, after: '-.8s' }, { x: -64, y: 22, w: 18, after: '-4.3s' }];

  notes: { quick: ['gulls', 'star', 'fish', 'school'], slow: ['sail', 'trawler', 'freighter'], gulls: [16, 44], fish: [16, 34] },
  drive: { quick: ['gulls', 'star', 'fish'], slow: ['sail', 'tug', 'trawler'], gulls: [18, 48], fish: [14, 30] },

var CLOUDS = {home: [{ x: 9, at: 0.24, w: 290, rows: 6, takes: 560 }, { x: 66, at: 0.1, w: 210, rows: 5, takes: 800 }, { x: 82, at: 0.44, w: 330, rows: 7, takes: 470 }, { x: 34, at: 0.56, w: 170, rows: 4, takes: 690 }], team: [{ x: 78, at: 0.12, w: 270, rows: 6, takes: 600 }, { x: 6, at: 0.34, w: 230, rows: 5, takes: 740 }, { x: 44, at: 0.05, w: 170, rows: 4, takes: 860 }], agents: [{ x: 4, at: 0.12, w: 270, rows: 6, takes: 600 }, { x: 78, at: 0.34, w: 230, rows: 5, takes: 740 }, { x: 46, at: 0.05, w: 170, rows: 4, takes: 860 }], notes: [{ x: 16, at: 0.3, w: 230, rows: 4, takes: 720 }, { x: 72, at: 0.14, w: 170, rows: 3, takes: 900 }], drive: [{ x: 64, at: 0.24, w: 220, rows: 4, takes: 780 }, { x: 10, at: 0.12, w: 160, rows: 3, takes: 960 }], plans: [], note: [{ x: 58, at: 0.2, w: 190, rows: 3, takes: 880 }], settings: [{ x: 44, at: 0.26, w: 190, rows: 3, takes: 960 }], record: [{ x: 24, at: 0.3, w: 260, rows: 4, takes: 940 }]};

var QUICK = ['gulls', 'whale', 'star', 'fish', 'flyer', 'marlin', 'dolphins', 'school'];
class Component extends DCLogic {
  componentDidMount() {

  componentWillUnmount() { this.alive = false; clearTimeout(this.quickT); clearTimeout(this.slowT); }
