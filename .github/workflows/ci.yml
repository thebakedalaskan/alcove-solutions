name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Integration tests only (no unit, browser or Storybook tests)
        run: node scripts/check-tests.mjs
      - name: Strict typing (no any, assertions, non-null or suppressions)
        run: node scripts/check-types.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The web app's route tree is generated by its build; generate it before typechecking.
      - run: pnpm --filter @alcove/web build
      - run: pnpm turbo run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build
      - name: API container builds
        run: docker build -f apps/api/Dockerfile -t alcove-api:ci .

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17
        env: { POSTGRES_USER: alcove, POSTGRES_PASSWORD: alcove, POSTGRES_DB: alcove }
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U alcove" --health-interval 2s --health-timeout 3s --health-retries 30
      objects:
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: alcove, RUSTFS_SECRET_KEY: alcove-ci-secret, RUSTFS_VOLUMES: /data, RUSTFS_ADDRESS: ':9000', RUSTFS_CONSOLE_ENABLE: 'false' }
        ports: ['9310:9000']
    env:
      DATABASE_URL: postgres://alcove:alcove@127.0.0.1:54329/alcove
      TEST_DATABASE_URL: postgres://alcove:alcove@127.0.0.1:54329/alcove_test
      OBJECTS_ENDPOINT: http://127.0.0.1:9310
      OBJECTS_BUCKET: alcove-objects
      OBJECTS_ACCESS_KEY: alcove
      OBJECTS_SECRET_KEY: alcove-ci-secret
      WEB_ORIGIN: http://localhost:3000
      RP_ID: localhost
      # A throwaway test key; production keys live in Secret Manager.
      KSERVICE: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Wait for the object store
        run: for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9310/ && exit 0; sleep 1; done; exit 1
      - run: pnpm turbo run test
