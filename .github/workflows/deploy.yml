name: Deploy

# Deploys only after CI passes on main, and only once infrastructure exists: set the repository variable
# DEPLOY_ENABLED=true when infra/confidential-space/README.md › First setup is done.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits. refresh.yml has a group of its own (a run waiting in this one would cancel a
# deploy waiting behind it) and skips while a deploy is queued or running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify deployment commit
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.commit.outputs.current }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Skip commits superseded on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          CURRENT_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          printf 'sha=%s\n' "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          if [ "$DEPLOY_SHA" = "$CURRENT_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'This commit has been superseded on main; its deployment is skipped.'
          fi

  release:
    name: API and web app → Confidential Space
    needs: prepare
    if: needs.prepare.outputs.current == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: no long-lived GCP keys in GitHub.
    # This job holds the identity that signs images and rolls the group, so it runs only our scripts and pinned tools:
    # the check, which installs and runs workspace code, is the next job, with no Google credentials.
    outputs:
      image: ${{ steps.deploy.outputs.image }}
      address: ${{ steps.deploy.outputs.address }}
    env:
      DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
      # Not secret; infra/confidential-space/env.sh reads them (README.md › Settings).
      ALCOVE_LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
      ALCOVE_OBJECTS_ENDPOINT: ${{ vars.OBJECTS_ENDPOINT }}
      ALCOVE_GOOGLE_SIGNUP_MODE: ${{ vars.GOOGLE_SIGNUP_MODE }}
      ALCOVE_NEAR_AI_ENABLED: ${{ vars.NEAR_AI_ENABLED }}
      ALCOVE_GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED }}
      # cosign v2: v3 stores signatures as OCI referrers, which Confidential Space's launcher doesn't look for.
      COSIGN_VERSION: 2.6.5
      COSIGN_SHA256: c3b4f5410e608af03a5eb0aaac84a4313d8da131248e08ff1759ac70c79d1644
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}', persist-credentials: false }
      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Install cosign
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  $RUNNER_TEMP/bin/cosign" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/bin/cosign"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build and push the image
        id: build
        run: infra/confidential-space/build.sh production "$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: Sign it, in Sigstore's public log
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: infra/confidential-space/sign.sh "$IMAGE" "$DEPLOY_SHA"
      - name: Run database migrations
        # Migrations only shape tables: the job gets the database and nothing else, no keys or provider secrets.
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          CLOUDSQL_INSTANCE: ${{ vars.GCP_CLOUDSQL_INSTANCE }}
        run: |
          SECRET_BINDINGS='DATABASE_URL=alcove-database-url:latest'
          gcloud --project="$GCP_PROJECT_ID" run jobs deploy alcove-migrate --image "$IMAGE" --region "$GCP_REGION" \
            --command node --args dist/migrate-cli.js \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" --set-cloudsql-instances "$CLOUDSQL_INSTANCE" \
            --tasks 1 --parallelism 1 --max-retries 0 --task-timeout 300s --cpu 1 --memory 512Mi \
            --set-env-vars "LOG_FORMAT=json,LOG_LEVEL=info" \
            --set-secrets "$SECRET_BINDINGS" --quiet
          gcloud --project="$GCP_PROJECT_ID" run jobs execute alcove-migrate --region "$GCP_REGION" --wait --quiet
      - name: Still main's newest commit
        # Re-running a run's failed jobs reuses prepare's answer from its first attempt, so an old run re-run later would
        # roll production back (13 Nov 2026). Ask again right before rolling out.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          CURRENT_SHA="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          if [ "$DEPLOY_SHA" != "$CURRENT_SHA" ]; then
            echo "::error::$DEPLOY_SHA is no longer main's newest commit ($CURRENT_SHA); not rolling it out."
            exit 1
          fi
      - name: Roll it out
        id: deploy
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        # deploy.sh writes only its key=value lines to stdout; gcloud's own output goes to stderr.
        run: infra/confidential-space/deploy.sh "$IMAGE" production >> "$GITHUB_OUTPUT"

  verify:
    name: Check the server as the app does, and its TLS key
    needs: [prepare, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No Google credentials and no OIDC token: it only reads the public endpoint.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.prepare.outputs.sha }}', persist-credentials: false }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @alcove/confidential-space...
      - name: Through the load balancer's own address, so it checks this rollout whatever DNS says
        env:
          DEPLOY_SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE: ${{ needs.release.outputs.image }}
          ADDRESS: ${{ needs.release.outputs.address }}
        run: |
          pnpm --filter @alcove/confidential-space exec tsx verify-server.ts https://api.alcove.solutions \
            --web https://alcove.solutions --connect "$ADDRESS" --commit "$DEPLOY_SHA" --digest "${IMAGE#*@}"
